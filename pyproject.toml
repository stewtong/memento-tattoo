[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-tattoo"
version = "0.5.1"
description = "Persistent memory for coding agents, inspired by Christopher Nolan's Memento."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "memento-tattoo maintainers" }]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
keywords = ["agents", "memory", "llm", "cli", "markdown"]

[project.urls]
Homepage = "https://github.com/stewtong/memento-tattoo"
Source = "https://github.com/stewtong/memento-tattoo"
Issues = "https://github.com/stewtong/memento-tattoo/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
memento-tattoo = "memento_tattoo.cli:main"

[tool.setuptools.package-data]
memento_tattoo = ["templates/*.md"]

[tool.setuptools.data-files]
"share/memento-tattoo" = ["MEMENTO-PATTERN.md"]
"share/memento-tattoo/templates" = ["templates/AGENTS.md", "templates/PROTOCOL.md", "templates/memento-stub.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
