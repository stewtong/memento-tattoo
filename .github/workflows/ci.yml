name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run evaluation tests
        run: python -m pytest -q bench/tests bench/w9b/tests
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Smoke example CLI
        run: |
          memento-tattoo --root examples/basic/memento doctor
          memento-tattoo --root examples/basic/memento load --query "rename an exported function in a shared package"

  wheel:
    name: Test built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel and pytest
        run: python -m pip install pytest dist/*.whl
      - name: Check tests import the installed wheel
        run: |
          cd "$RUNNER_TEMP"
          python -c "import memento_tattoo; p = memento_tattoo.__file__; print(p); assert '/src/' not in p and 'site-packages' in p, p"
      - name: Run tests against installed wheel
        run: python -m pytest -q -o pythonpath= .

  sdist:
    name: Test built sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel and pytest
        run: python -m pip install pytest dist/*.whl
      - name: Unpack sdist
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
      - name: Run sdist tests against installed wheel
        working-directory: ${{ runner.temp }}/sdist
        run: |
          python -c "import memento_tattoo; p = memento_tattoo.__file__; print(p); assert '/src/' not in p and 'site-packages' in p, p"
          python -m pytest -q -o pythonpath= .
