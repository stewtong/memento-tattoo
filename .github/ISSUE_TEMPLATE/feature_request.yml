name: Feature request
description: A change to what memento-tattoo does.
labels: [enhancement]
body:
  - type: textarea
    id: situation
    attributes:
      label: The situation
      description: What were you or your agent doing when the current behavior fell short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered
